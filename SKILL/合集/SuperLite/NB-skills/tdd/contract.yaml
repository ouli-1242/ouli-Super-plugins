id: "NB-skills/tdd"
name: "tdd"
version: "1.0.1"
owner: "ouli"
status: "active"
purpose: "Drive all production code through the red-green loop with tests worth keeping, written first at pre-agreed seams."
when_to_use:
  - "Writing or about to write production code (feature or bug fix)"
when_not_to_use:
  - "Requirements not yet confirmed (ask the user first)"
  - "Documentation/analysis work (writing)"
required_capabilities:
  - "Test runner operation; git branching"
recommended_models: "flagship tier (strong models)"
fallback_variant: "SuperLite/tdd (loop rules walkthrough, for mid/weak models)"
dependencies:
  tools: [project test runner, git]
  apis: []
  data:
    - "docs/测试.md, docs/技术依据.md glossary, docs/决策记录.md (when present)"
  skills: [code-review, diagnosing-bugs]
permissions:
  - "Write source and tests; local git commits; no push from this skill"
data_scope: "current workspace repository"
risk_level: "L1"
confirmation_required:
  - "Implementing on main/master"
  - "Skipping the Iron Law for an exception case"
input_contract:
  required: "a task with a clear deliverable (feature or bug with clear fix path)"
  optional: "project seam declarations (docs/测试.md)"
  missing_behavior: "requirements unconfirmed -> stop and ask the user"
output_contract:
  format: "vertical slices, each preceded by a failing test at a confirmed seam; regression test per fix"
  quality: "tests specify public behavior and survive refactors; expected values from independent sources of truth"
constraints:
  - "Iron Law: no production code without a failing test first; violations are deleted, not adapted"
  - "Watch it fail before every green; suite stays green after"
  - "One slice per cycle; refactoring belongs to code-review, not the loop"
forbidden:
  - "Testing at unconfirmed seams; testing interfaces still being reshaped"
  - "Implementation-coupled, tautological, or horizontal-sliced tests"
  - "Starting on main/master without explicit consent"
  - "Iron-Law rationalizations ('too simple to test', 'I'll test after', 'already manually tested' - counters in references/rationalizations.md)"
acceptance_criteria:
  - "Every production change preceded in history by a failing test for the right reason"
  - "Seams named and user-agreed"
self_check:
  - "Can I name the seam each test lives at and who agreed to it?"
  - "Did I watch every test fail before making it pass?"
failure_and_escalation:
  no_test_runner: "stop and ask before writing code"
  bug_surfaces_mid_loop: "switch to diagnosing-bugs"
  test_cannot_be_deterministic: "stop and raise; never ship a flaky guard"
stop_conditions:
  - "User declines the TDD requirement for the task (record the deviation)"
cost_latency_budget:
  max_tokens: "16000"
  max_tool_calls: "~10 red-green cycles before reporting progress and re-scoping"
  over_budget_action: "report progress, re-scope with the user"
examples:
  positive: "write failing test -> watch it fail with the right message -> minimal guard -> green -> commit"
  negative: "expect(add(a,b)).toBe(a+b) - a tautology that proves nothing"
  edge: "exploration spike is legitimate; throw it away and start the real change with TDD"
evaluation:
  metrics: [production commits without preceding failing test (target 0), tests invalidated by refactors, tautological tests caught in review]
observability:
  log: "seam agreements in task/commit; violations to docs/日志/ when a project exists"
review_cycle: "90 days"
changelog:
  - "1.0.0 (2026-09-19): contract-style rewrite of SuperLite/tdd; requirements gate asks the user directly (no sibling router dependency)."

  - "1.0.1 (2026-09-20): rationalization table restored as references/rationalizations.md (L2); pressure-driven rule-skipping needs prohibition + rationalization counters, not prose alone."