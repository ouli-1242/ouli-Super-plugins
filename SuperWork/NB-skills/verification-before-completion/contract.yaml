id: "NB-skills/verification-before-completion"
name: "verification-before-completion"
version: "1.0.0"
owner: "ouli"
status: "active"
purpose: "Guarantee no success claim without fresh verification evidence read this turn; carry honest boundaries with every claim."
when_to_use:
  - "Before any completion/success claim, commit, PR, task transition, or trusting a delegated agent report"
when_not_to_use:
  - "As a substitute for code-review (review first at thresholds, then verify)"
required_capabilities:
  - "Ability to run and read test/lint/build commands"
recommended_models: "flagship tier (strong models)"
fallback_variant: "SuperWork/verification-before-completion (gate walkthrough, for mid/weak models)"
dependencies:
  tools: [project test/lint/build commands]
  apis: []
  data: []
  skills: [code-review, executing-plans]
permissions:
  - "Run verification commands; read-only otherwise"
data_scope: "current workspace"
risk_level: "L0"
confirmation_required: []
input_contract:
  required: "the claim about to be made"
  optional: "plan/spec-prescribed verification commands"
  missing_behavior: "no proving command exists -> report that fact; never claim"
output_contract:
  format: "claim + evidence (command, exit code, failure counts) + 诚实边界 + 偏离声明"
  quality: "no \"should/probably/seems to\" in any status claim"
constraints:
  - "Iron Law: no completion claims without fresh verification evidence"
  - "Each claim type has required evidence (tests->0 failures; build->exit 0; bug->original symptom re-tested; agent work->VCS diff)"
forbidden:
  - "Satisfaction or success wording before verification"
  - "Trusting partial checks, stale runs, or agent success reports"
acceptance_criteria:
  - "Every success statement traceable to fresh command output from this turn"
self_check:
  - "Can I point to the exact command and output for each claim?"
  - "Is 诚实边界 present whenever something was skipped?"
failure_and_escalation:
  verification_fails: "state actual status with evidence; failure is the report"
  no_proving_command: "name the missing evidence and ask how to obtain it"
  milestone_closure: "hand 诚实边界 to docs/日志/"
stop_conditions:
  - "User unavailable and the claim cannot be evidenced"
cost_latency_budget:
  max_tokens: "4000"
  max_tool_calls: "full commands as needed; subset + explicit coverage statement when a full suite is prohibitively slow"
  over_budget_action: "report what was verified and what was not"
examples:
  positive: "All tests pass: 34/34 (pytest -q, exit 0, this turn). 诚实边界: perf suite not run."
  negative: "trusting a sub-agent's \"success\" without checking the diff"
  edge: "huge suite -> affected subset + precise statement of what was not exercised"
evaluation:
  metrics: [unevidenced completion claims (target 0), honest-boundary presence rate, user-caught false claims]
observability:
  log: "evidence + 诚实边界 + 偏离声明 into docs/日志/ at milestones"
review_cycle: "90 days"
changelog:
  - "1.0.0 (2026-09-19): contract-style rewrite of SuperWork/verification-before-completion; source was already contract-heavy; gate table kept as claim->evidence mapping."
