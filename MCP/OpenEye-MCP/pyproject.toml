[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openeye-mcp"
dynamic = ["version"]
description = "为纯文本大模型提供视觉能力的 MCP Server：读图 · 识字 · 解表格 · 复刻 UI。Give text-only LLMs vision via MCP: image description, OCR, VQA, UI layout & tables."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "ouli-1242", email = "ouli1242@gmail.com" },
]
keywords = ["mcp", "vision", "ocr", "openai", "llm", "model-context-protocol", "gemini", "deepseek", "visual-question-answering", "image-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "Pillow>=10.0.0",
    "loguru>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/ouli-1242/openeye-mcp"
Repository = "https://github.com/ouli-1242/openeye-mcp"
Issues = "https://github.com/ouli-1242/openeye-mcp/issues"
Changelog = "https://github.com/ouli-1242/openeye-mcp/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
]

[project.scripts]
openeye = "openeye_mcp.server:run"

[tool.setuptools.packages.find]
where = ["src"]

# 版本号单一来源：运行时用 __init__.__version__，打包元数据从同一处读取，
# 不再需要在两处手工同步
[tool.setuptools.dynamic]
version = { attr = "openeye_mcp.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ASYNC"]
# 本项目刻意不用各厂商 SDK、手写 httpx 请求，B 系列的路径/异常规则照此收敛。
# SIM117：测试与 patch 上下文按「被测对象 / 打桩目标」分行书写比压成一行更易读
ignore = ["E501", "SIM117"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# mcp 的类型模型用 camelCase alias 构造（populate_by_name=False）：运行时按
# alias 传参是正确写法，但 mypy 只认 snake_case 字段名，会误报 call-arg
module = ["openeye_mcp.server"]
disable_error_code = ["call-arg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
