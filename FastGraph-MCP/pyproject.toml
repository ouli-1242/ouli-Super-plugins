[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastgraph-mcp"
version = "0.1.0"
description = "Lightweight real-time code intelligence MCP: AST + incremental index + code graph, no embeddings, low memory & low context."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.11",
    "tree-sitter>=0.24",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c>=0.23",
]

[project.scripts]
fastgraph = "fastgraph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fastgraph"]